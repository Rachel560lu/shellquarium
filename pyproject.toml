[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shellquarium"
version = "0.1.0"
description = "A cozy terminal aquarium pet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["textual>=0.70,<1"]

[project.scripts]
shellquarium = "shellquarium.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
